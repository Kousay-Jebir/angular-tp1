<section class="container">
  <h2 class="title">Rainbow Typing Simulator - RxJS</h2>
  <p class="lead">
    Type in the inputs and watch the text and border colors change on every
    keyup.
  </p>

  <label class="label" for="nameInput">Your name</label>
  <input
    id="nameInput"
    appRainbowTyping
    type="text"
    placeholder="Type here"
    class="input"
    autocomplete="off"
  />

  <label class="label" for="jobInput">Your job</label>
  <input
    id="jobInput"
    appRainbowTyping
    type="text"
    placeholder="Type here too"
    class="input"
    autocomplete="off"
  />
</section>
