<div
  class="cv-item d-flex align-items-center gap-2"
  role="button"
  tabindex="0"
  (click)="onSelectCv()"
  (keydown)="onKeydown($event)"
>
  <img
    [ngStyle]="{ width: size + 'px', height: size + 'px' }"
    class="rounded-circle"
    [src]="'assets/images/' + (cv.path | defaultImage)"
    [alt]="cv.name"
  />
  <span>{{ cv.firstname }} {{ cv.name }}</span>
</div>
