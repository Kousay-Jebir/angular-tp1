<p>add-cv works!</p>
<form [formGroup]="form">
  Name:
  <input type="text" class="form-control" formControlName="name" />
  <div
    *ngIf="form.get('name')?.errors && form.get('name')?.touched"
    class="alert alert-danger"
  >
    Ce champ est obligatoire
  </div>
  Firstname:
  <input type="text" class="form-control" formControlName="firstname" /> Age:
  <input type="text" class="form-control" formControlName="age" /> Cin:
  <input type="text" class="form-control" formControlName="cin" />
  <div
    *ngIf="
      form.errors && form.errors['cinFirstCars'] && cin?.touched && age?.touched
    "
    class="alert alert-danger"
  >
    Cette Cin est invalide
  </div>
  <div
    *ngIf="
    form.errors?.['cinAgeMismatch'] &&
    cin?.touched &&
    age?.touched
  "
    class="alert alert-danger"
  >
    Cin non cohérente avec l âge.
  </div>
  Job: <input type="text" class="form-control" formControlName="job" />
  Path:
  <input type="text" class="form-control" formControlName="path" />
  <div
    *ngIf="path?.errors?.['underagePathNotAllowed'] && path?.touched"
    class="alert alert-danger"
  >
    Les mineurs ne peuvent pas renseigner le path de l image.
  </div>
  <div *ngIf="cin.errors?.['cinTaken']">
  Ce CIN est déjà utilisé.
</div>

  <button [disabled]="form.invalid" class="btn btn-primary" (click)="addCv()">
    add cv
  </button>
</form>
{{ form.errors | json }}
