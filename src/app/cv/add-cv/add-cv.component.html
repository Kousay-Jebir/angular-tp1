<form [formGroup]="form" (ngSubmit)="addCv()" class="d-grid gap-2">
  <label>Name:</label>
  <input type="text" class="form-control" formControlName="name" />
  @if (name.invalid && name.touched) {
  <div class="alert alert-danger">Ce champ est obligatoire</div>
  }

  <label>Firstname:</label>
  <input type="text" class="form-control" formControlName="firstname" />

  <label>Age:</label>
  <input type="number" class="form-control" formControlName="age" min="0" />

  <label>CIN:</label>
  <input type="text" class="form-control" formControlName="cin" maxlength="8" />
  @if (form.errors?.['cinFirstCars'] && cin.touched && age.touched) {
  <div class="alert alert-danger">Cette CIN est invalide pour l’âge saisi</div>
  }

  <label>Job:</label>
  <input type="text" class="form-control" formControlName="job" />

  <label>Path:</label>
  <input type="text" class="form-control" formControlName="path" />

  <button class="btn btn-primary mt-3" type="submit" [disabled]="form.invalid">
    Add CV
  </button>
</form>

<!-- debug helper, remove when done -->
<pre class="mt-3 small">{{ form.errors | json }}</pre>
