<div class="row">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <input [(ngModel)]="todo.name" type="text" class="form-control" placeholder="name">
    <input [(ngModel)]="todo.content" type="text" class="form-control" placeholder="content">
    <select [(ngModel)]="todo.status" class="form-select">
      <option value="waiting">Waiting</option>
      <option value="in progress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <button (click)="addTodo()" [disabled]="!todo.name.trim() || !todo.content.trim()" class="btn btn-primary m-2"
      style="background-color: red;">add</button>
  </div>
  <div class="row">
    <table class="table table-bordered text-center">
      <thead class="table-light">
        <tr>
          <th>Waiting</th>
          <th>In Progress</th>
          <th>Done</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="width: 500px; height: 100px; vertical-align: top; overflow-y: auto;">
            <ul style="list-style: none;"> @for (todo of waitingTodos(); track todo) {

              <app-todo-element [todo]="todo" [onDelete]="deleteTodo.bind(this)"
                [onStatusChange]="updateTodoStatus.bind(this)">
              </app-todo-element>
              }
            </ul>
          </td>
          <td style="width: 500px; height: 100px; vertical-align: top; overflow-y: auto;">
            <ul style="list-style: none;"> @for (todo of inProgressTodos(); track todo) {
              <app-todo-element [todo]="todo" [onDelete]="deleteTodo.bind(this)"
                [onStatusChange]="updateTodoStatus.bind(this)">
              </app-todo-element>
              }
            </ul>
          </td>
          <td style="width: 500px; height: 100px; vertical-align: top; overflow-y: auto;">
            <ul style="list-style: none;"> @for (todo of doneTodos(); track todo) {

              <app-todo-element [todo]="todo" [onDelete]="deleteTodo.bind(this)"
                [onStatusChange]="updateTodoStatus.bind(this)">
              </app-todo-element>
              }
            </ul>
          </td>
        </tr>
      </tbody>
    </table>



  </div>
</div>
